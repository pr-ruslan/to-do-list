{% extends "base.html" %}

{% block content %}
<div class="container">
    <h1>{% if form.instance.pk %}Edit Tag{% else %}Add New Tag{% endif %}</h1>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit" class="btn">Save</button>
        <a href="{% url 'tasks:tag-list' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
